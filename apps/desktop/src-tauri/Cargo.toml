[package]
name = "portugol-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IDE desktop do Portugol (Tauri v2)"

[lib]
name = "portugol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cap-std = "4"
portugol-service = { path = "../../../crates/portugol-service" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
ureq = "2"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm"] }
