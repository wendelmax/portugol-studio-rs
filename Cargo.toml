[workspace]
resolver = "2"
members = [
    "crates/ferro-hir",
    "crates/ferro-frontend",
    "crates/ferro-rust",
    "crates/ferro-bytecode",
    "crates/ferro-vm",
    "crates/ferro-wasm",
    "crates/ferro-service",
    "crates/ferro-cli",
    "crates/ferro-tela",
    "crates/ferro-formatos",
    "apps/desktop/src-tauri",
]
# A IDE depende de webkit2gtk/Tauri; fica fora do `cargo build`/`cargo test`
# padrão. Use `-p ferro-desktop` ou `npm run tauri` em apps/desktop.
default-members = [
    "crates/ferro-hir",
    "crates/ferro-frontend",
    "crates/ferro-bytecode",
    "crates/ferro-vm",
    "crates/ferro-wasm",
    "crates/ferro-rust",
    "crates/ferro-service",
    "crates/ferro-cli",
    "crates/ferro-tela",
    "crates/ferro-formatos",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "LGPL-3.0-only"
repository = "https://github.com/wendelmax/portugol-studio-rs"

[profile.release]
lto = "thin"
codegen-units = 1

# Dependências otimizadas também em debug: decodificar as imagens dos jogos
# nos testes de regressão leva minutos sem isso.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.ferro-vm]
opt-level = 3
