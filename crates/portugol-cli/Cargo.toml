[package]
name = "portugol-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI do Portugol Studio RS: criação, validação, formatação, exportação Rust/Cargo, execução e depuração de programas .pors"

[[bin]]
name = "portugol"
path = "src/main.rs"

[dependencies]
portugol-hir = { path = "../portugol-hir" }
portugol-rs-frontend = { path = "../portugol-rs-frontend" }
portugol-rust = { path = "../portugol-rust" }
portugol-bytecode = { path = "../portugol-bytecode" }
portugol-vm = { path = "../portugol-vm" }
