name: Release

# Gera os instaladores agrupados por plataforma (Windows, Linux e macOS em
# x86_64 e ARM64) e publica um release em rascunho. O caminho normal é o
# workflow "Preparar release", que chama este com a tag e as notas da versão.
# Também roda quando uma tag v* é enviada manualmente ou por disparo manual
# (pré-lançamento de teste). Assinatura é opcional: veja docs/DISTRIBUICAO.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex.: v0.2.0). Vazia usa v<número>-dev"
        required: false
        type: string
  workflow_call:
    inputs:
      tag_release:
        description: "Tag já criada pelo workflow Preparar release"
        required: true
        type: string
      notas:
        description: "Notas da versão em Markdown"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # Cria (ou reaproveita) o rascunho antes dos builds paralelos para evitar
  # condição de corrida entre os grupos Windows, Linux e macOS.
  rascunho:
    if: github.actor != 'github-actions[bot]'
    name: Preparar rascunho do release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag_release || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag || format('v{0}-dev', github.run_number) }}
      PRERELEASE: ${{ github.ref_type != 'tag' && !inputs.tag_release }}
      NOTAS: ${{ inputs.notas }}
    steps:
      - name: Criar rascunho do release se não existir
        run: |
          set -euo pipefail
          existing_id="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' \
            | head -n 1)"
          if [[ -n "$existing_id" && "$existing_id" != "null" ]]; then
            echo "Rascunho/release ${RELEASE_TAG} já existe (id ${existing_id})."
            exit 0
          fi

          body="${NOTAS}

          ### Arquivos suportados

          O Portugol Studio RS suporta programas **Portugol-RS (\`.pors\`)**, exercícios **\`.pors.json\`** e arquivos/projetos **Rust (\`.rs\` / Cargo)**. O suporte ao formato clássico \`.por\`/\`.pex\` foi retirado (ADR 0016); para projetos legados, utilize o [Portugol Studio original](https://github.com/UNIVALI-LITE/Portugol-Studio).

          ### Instalação

          - **Windows (x86_64 e ARM64):** \`.exe\` (x64 e ARM64) e \`.msi\` (x64)
          - **Linux (x86_64 e ARM64):** \`.deb\`, \`.rpm\`, \`.AppImage\` e \`.pkg.tar.zst\` (Arch Linux)
          - **macOS (Apple Silicon ARM64 e Intel x86_64):** \`.dmg\` e \`.app.tar.gz\`

          Veja o README para mais detalhes e requisitos."

          payload="$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "Portugol Studio RS ${RELEASE_TAG}" \
            --arg body "$body" \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: $prerelease}')"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" >/dev/null
          echo "Rascunho criado para ${RELEASE_TAG}."

  # Grupo 1: Windows (x86_64 e ARM64)
  windows:
    if: github.actor != 'github-actions[bot]'
    needs: [rascunho]
    name: Windows — ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: x86_64 (.exe, .msi)
            os: windows-latest
            args: ""
          - nome: ARM64 (.exe)
            os: windows-11-arm
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_SECRET: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT_SECRET: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_SECRET: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE_SECRET: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
      RELEASE_TAG: ${{ inputs.tag_release || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag || format('v{0}-dev', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_release || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dependências do frontend
        working-directory: apps/desktop
        run: npm ci

      # Opção 1: certificado .pfx (OV/EV) em base64 no secret WINDOWS_CERTIFICATE.
      - name: Assinatura Windows com certificado .pfx
        if: env.WINDOWS_CERTIFICATE_SECRET != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificado.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_SECRET))
          $senha = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD_SECRET -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $senha
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path apps/desktop/src-tauri/tauri.assinatura.json -Value $config
          "TAURI_SIGN_CONFIG=--config src-tauri/tauri.assinatura.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Opção 2: Azure Trusted Signing (assinatura na nuvem, sem arquivo .pfx).
      - name: Assinatura Windows com Azure Trusted Signing
        if: env.WINDOWS_CERTIFICATE_SECRET == '' && env.AZURE_CLIENT_ID_SECRET != ''
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --locked
          $cmd = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT_SECRET -a $env:AZURE_SIGNING_ACCOUNT_SECRET -c $env:AZURE_CERTIFICATE_PROFILE_SECRET -d Portugol-Studio %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path apps/desktop/src-tauri/tauri.assinatura.json -Value $config
          "TAURI_SIGN_CONFIG=--config src-tauri/tauri.assinatura.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Gerar instaladores Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Portugol Studio RS ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' && !inputs.tag_release }}
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_CONFIG }}

      - name: Verificar assinatura (Windows)
        if: env.WINDOWS_CERTIFICATE_SECRET != '' || env.AZURE_CLIENT_ID_SECRET != ''
        shell: pwsh
        run: |
          $arquivos = Get-ChildItem -Recurse target/release/bundle -Include *.exe,*.msi
          foreach ($a in $arquivos) {
            $s = Get-AuthenticodeSignature $a.FullName
            Write-Host "$($a.Name): $($s.Status)"
            if ($s.Status -ne 'Valid') { throw "$($a.Name) não está assinado corretamente" }
          }

  # Grupo 2a: Linux (.deb, .rpm, .AppImage em x86_64 e ARM64)
  linux:
    if: github.actor != 'github-actions[bot]'
    needs: [rascunho]
    name: Linux — ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: x86_64 (.deb, .rpm, .AppImage)
            os: ubuntu-22.04
            appindicator_pkg: libappindicator3-dev
            args: ""
          - nome: ARM64 (.deb, .rpm, .AppImage)
            os: ubuntu-24.04-arm
            appindicator_pkg: libayatana-appindicator3-dev
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag_release || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag || format('v{0}-dev', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_release || '' }}

      - name: Dependências do sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev ${{ matrix.appindicator_pkg }} librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dependências do frontend
        working-directory: apps/desktop
        run: npm ci

      - name: Gerar instaladores Linux
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Portugol Studio RS ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' && !inputs.tag_release }}
          args: ${{ matrix.args }}

  # Grupo 2b: Linux — Arch Linux (.pkg.tar.zst em x86_64 e ARM64)
  linux_arch:
    if: github.actor != 'github-actions[bot]'
    needs: [rascunho]
    name: Linux — Arch ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: x86_64 (.pkg.tar.zst)
            os: ubuntu-latest
            image: archlinux:latest
            init_keys: "false"
          - nome: ARM64 (.pkg.tar.zst)
            os: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest
            init_keys: "true"
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    env:
      RELEASE_TAG: ${{ inputs.tag_release || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag || format('v{0}-dev', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_release || '' }}

      - name: Dependências do sistema (Arch Linux)
        env:
          INIT_KEYS: ${{ matrix.init_keys }}
        run: |
          if [[ "$INIT_KEYS" == "true" ]]; then
            pacman-key --init
            pacman-key --populate archlinuxarm
          fi
          if ! grep -qE '^[[:space:]]*DisableSandbox' /etc/pacman.conf; then
            sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          fi
          pacman -Syu --noconfirm --needed base-devel rust nodejs npm pkgconf webkit2gtk-4.1 gtk3 alsa-lib curl jq zstd

      - name: Gerar pacote Arch Linux (.pkg.tar.zst)
        run: bash packaging/arch/build-package.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist-arch"

      - name: Anexar pacote Arch Linux ao release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkg_file="$(ls "$GITHUB_WORKSPACE"/dist-arch/portugol-studio-rs-*.pkg.tar.zst | head -n 1)"
          asset_name="$(basename "$pkg_file")"
          release_id="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' \
            | head -n 1)"
          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "Release não encontrado para a tag $RELEASE_TAG" >&2
            exit 1
          fi
          existing_asset_id="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
            | head -n 1)"
          if [[ -n "$existing_asset_id" && "$existing_asset_id" != "null" ]]; then
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}"
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zstd" \
            --data-binary "@${pkg_file}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}" >/dev/null
          echo "Asset ${asset_name} enviado para o release ${RELEASE_TAG} (id ${release_id})."

  # Grupo 3: macOS (Apple Silicon ARM64 e Intel x86_64)
  macos:
    if: github.actor != 'github-actions[bot]'
    needs: [rascunho]
    name: macOS — ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Apple Silicon ARM64 (.dmg)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - nome: Intel x86_64 (.dmg)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_TAG: ${{ inputs.tag_release || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag || format('v{0}-dev', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_release || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Dependências do frontend
        working-directory: apps/desktop
        run: npm ci

      # Sem certificado, nenhuma variável APPLE_* é definida e o Tauri gera um
      # .dmg sem assinatura nem notarização (instalável após abrir com botão
      # direito → Abrir no macOS).
      - name: Assinatura macOS
        if: env.APPLE_CERTIFICATE_SECRET != ''
        run: |
          echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"

      - name: Gerar instaladores macOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Portugol Studio RS ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' && !inputs.tag_release }}
          args: ${{ matrix.args }}
