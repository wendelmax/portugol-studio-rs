name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide o que precisa rodar. Mudanças só em documentação, imagens ou
  # arquivos de apoio não disparam build nem testes.
  mudancas:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nucleo: ${{ steps.filtro.outputs.nucleo }}
      ide: ${{ steps.filtro.outputs.ide }}
      arch_pkg: ${{ steps.filtro.outputs.arch_pkg }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            nucleo:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            ide:
              - 'apps/desktop/**'
              - 'apps/web-playground/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            arch_pkg:
              - 'packaging/arch/**'
              - '.github/workflows/release.yml'
              - 'scripts/release.sh'

  nucleo:
    name: Núcleo (${{ matrix.os }})
    needs: mudancas
    if: needs.mudancas.outputs.nucleo == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'ubuntu-latest' && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Formatação
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Núcleo PORS mínimo (wasm32)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p portugol-vm --no-default-features --all-targets
          cargo clippy -p portugol-vm --no-default-features --all-targets -- -D warnings
          cargo check --target wasm32-unknown-unknown -p portugol-hir -p portugol-rs-frontend -p portugol-bytecode -p portugol-vm --no-default-features
          cargo build --target wasm32-unknown-unknown -p portugol-wasm
      - name: Testes do núcleo
        run: cargo test

  ide:
    name: IDE (frontend + Tauri)
    needs: mudancas
    if: needs.mudancas.outputs.ide == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema
        timeout-minutes: 45
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y libwebkit2gtk-4.1-dev libasound2-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool xclip imagemagick x11-utils dbus-x11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Verificação E2E e visual (1536×960 e 1280×800)
        working-directory: apps/desktop
        timeout-minutes: 3
        run: npm run test:e2e
      - name: Clippy do app
        run: cargo clippy -p portugol-desktop -- -D warnings
      - name: Compilar o app com protocolo de produção
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build -p portugol-desktop --features tauri/custom-protocol --config 'profile.dev.package."*".opt-level=0'
      - name: Testes do app
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p portugol-desktop --lib --features tauri/custom-protocol --config 'profile.dev.package."*".opt-level=0'
      - name: Janela gráfica nativa
        timeout-minutes: 2
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node apps/desktop/tests/graphics-smoke.mjs

  ide_multiplataforma:
    name: IDE (Tauri em ${{ matrix.os }})
    needs: mudancas
    if: needs.mudancas.outputs.ide == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Clippy do app
        run: cargo clippy -p portugol-desktop --all-targets -- -D warnings
      - name: Testes do app com protocolo de produção
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p portugol-desktop --lib --features tauri/custom-protocol

  arch_pkg:
    name: Pacote Arch Linux (${{ matrix.nome }})
    needs: mudancas
    if: needs.mudancas.outputs.arch_pkg == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: x86_64
            os: ubuntu-latest
            image: archlinux:latest
            init_keys: "false"
          - nome: ARM64
            os: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest
            init_keys: "true"
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema (Arch Linux)
        env:
          INIT_KEYS: ${{ matrix.init_keys }}
        run: |
          if [[ "$INIT_KEYS" == "true" ]]; then
            pacman-key --init
            pacman-key --populate archlinuxarm
          fi
          if ! grep -qE '^[[:space:]]*DisableSandbox' /etc/pacman.conf; then
            sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          fi
          pacman -Syu --noconfirm --needed base-devel rust nodejs npm pkgconf webkit2gtk-4.1 gtk3 alsa-lib zstd
      - name: Construir e validar pacote Arch Linux
        run: bash packaging/arch/build-package.sh "" "$GITHUB_WORKSPACE/dist-arch"

  # Resultado único do CI: passa quando os jobs necessários passaram ou foram
  # pulados por não haver mudança relevante. Use este job como verificação
  # obrigatória na proteção da branch.
  concluido:
    name: CI concluído
    if: always()
    needs: [mudancas, nucleo, ide, ide_multiplataforma, arch_pkg]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir resultados
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            case "$r" in
              success|skipped) ;;
              *) echo "Algum job falhou ou foi cancelado."; exit 1 ;;
            esac
          done
