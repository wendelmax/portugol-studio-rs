[workspace]
resolver = "2"
members = [
    "crates/portugol-syntax",
    "crates/portugol-semantics",
    "crates/portugol-bytecode",
    "crates/portugol-vm",
    "crates/portugol-service",
    "crates/portugol-cli",
    "apps/desktop/src-tauri",
]
# A IDE depende de webkit2gtk/Tauri; fica fora do `cargo build`/`cargo test`
# padrão. Use `-p portugol-desktop` ou `npm run tauri` em apps/desktop.
default-members = [
    "crates/portugol-syntax",
    "crates/portugol-semantics",
    "crates/portugol-bytecode",
    "crates/portugol-vm",
    "crates/portugol-service",
    "crates/portugol-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
repository = "https://github.com/wendelmax/Portugol-Studio"

[profile.release]
lto = "thin"
codegen-units = 1
