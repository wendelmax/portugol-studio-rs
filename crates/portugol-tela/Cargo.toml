[package]
name = "portugol-tela"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Formato .design das telas desktop PORS (pseudo-XAML): parser, esquema de controles, validação e formatação canônica"

[dependencies]
portugol-hir = { path = "../portugol-hir" }
portugol-formatos = { path = "../portugol-formatos" }
portugol-rs-frontend = { path = "../portugol-rs-frontend", optional = true }

[features]
# Converte os tipos da tela para os registros externos do frontend PORS,
# usados ao analisar o code-behind.
frontend = ["dep:portugol-rs-frontend"]
