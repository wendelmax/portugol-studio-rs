schemaVersion: '1.0'
status: proposed
# Exemplo, expandir para UI-001..UI-035 após auditoria do repo.
features:
  - id: FEAT-EXEC-001
    title: Executar arquivo ativo
    ui: [UI-003, UI-021, UI-033]
    useCases: [UC-06]
    backend: [ExecutionPort]
    tauriIpc: [run_start, run_cancel] # nomes provisórios
    scenarios: [FT-03]
    acceptance:
      - "Executa a revisão capturada, não uma revisão posterior"
      - "O console apresenta somente eventos da execução ativa"
      - "Cancelamento é confirmado pelo backend"
    implementationStatus: not_assessed
    testStatus: not_run
  - id: FEAT-TRANSLATION-001
    title: Tradução Portugol para Rust
    ui: [UI-015, UI-016]
    useCases: [UC-08]
    backend: [TranslationPort]
    tauriIpc: [source_translate]
    scenarios: [FT-06]
    acceptance:
      - "Resultado vinculado à revisão e com status de compatibilidade"
      - "Código desvinculado nunca é sobrescrito"
    implementationStatus: not_assessed
    testStatus: not_run
  - id: FEAT-LEARN-001
    title: Seletor dos níveis de aprendizagem
    ui: [UI-028, UI-015]
    useCases: [UC-05, UC-07]
    backend: [LearningModePreference, portugol-service::export_rust]
    tauriIpc: [export_rust]
    scenarios: [FT-02]
    acceptance:
      - "beginner preserva o editor e runtime Portugol atuais"
      - "bridge exibe somente a exportação real suportada pelo serviço atual"
      - "rust permanece desabilitado com a capacidade ausente explicada"
      - "trocar modo não altera o texto fonte nem inicia outra engine"
    implementationStatus: implemented
    testStatus: automated_partial
    limitations:
      - "Preferência global em localStorage até existir WorkspaceStore"
      - "FT-02 não possui runner Gherkin; transição visual requer smoke/E2E posterior"
