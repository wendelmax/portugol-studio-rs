name: Release

# Gera os instaladores e publica um release em rascunho. O caminho normal é o
# workflow "Preparar release", que chama este com a tag e as notas da versão.
# Também roda quando uma tag v* é enviada manualmente ou por disparo manual
# (pré-lançamento de teste). Assinatura é opcional: veja docs/DISTRIBUICAO.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex.: v0.2.0). Vazia usa v<número>-dev"
        required: false
        type: string
  workflow_call:
    inputs:
      tag_release:
        description: "Tag já criada pelo workflow Preparar release"
        required: true
        type: string
      notas:
        description: "Notas da versão em Markdown"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  instaladores:
    # O release criado pela action cria a tag v* no repositório; sem este
    # filtro, um disparo manual causaria outro disparo por push de tag.
    if: github.actor != 'github-actions[bot]'
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows x64
            os: windows-latest
            args: ""
          - nome: Linux x64
            os: ubuntu-22.04
            args: ""
          - nome: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - nome: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Os secrets são lidos aqui e exportados com os nomes que o Tauri espera
      # apenas quando não estão vazios. Exportar uma variável vazia faz o
      # bundler tentar importar um certificado inexistente (e falhar).
      WINDOWS_CERTIFICATE_SECRET: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_CLIENT_ID_SECRET: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID_SECRET: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT_SECRET: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_SECRET: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE_SECRET: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
      APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_TAG: ${{ inputs.tag_release || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag || format('v{0}-dev', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Quando chamado pelo Preparar release, compila o commit da versão.
          ref: ${{ inputs.tag_release || '' }}

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Dependências do frontend
        working-directory: apps/desktop
        run: npm ci

      # Opção 1: certificado .pfx (OV/EV) em base64 no secret WINDOWS_CERTIFICATE.
      - name: Assinatura Windows com certificado .pfx
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_SECRET != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificado.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_SECRET))
          $senha = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD_SECRET -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $senha
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path apps/desktop/src-tauri/tauri.assinatura.json -Value $config
          "TAURI_SIGN_CONFIG=--config src-tauri/tauri.assinatura.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Opção 2: Azure Trusted Signing (assinatura na nuvem, sem arquivo .pfx).
      - name: Assinatura Windows com Azure Trusted Signing
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_SECRET == '' && env.AZURE_CLIENT_ID_SECRET != ''
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --locked
          $cmd = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT_SECRET -a $env:AZURE_SIGNING_ACCOUNT_SECRET -c $env:AZURE_CERTIFICATE_PROFILE_SECRET -d Portugol-Studio %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path apps/desktop/src-tauri/tauri.assinatura.json -Value $config
          "TAURI_SIGN_CONFIG=--config src-tauri/tauri.assinatura.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Sem certificado, nenhuma variável APPLE_* é definida e o Tauri gera um
      # .dmg sem assinatura nem notarização (instalável após abrir com botão
      # direito → Abrir no macOS).
      - name: Assinatura macOS
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_SECRET != ''
        run: |
          echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"

      - name: Gerar instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Portugol Studio RS ${{ env.RELEASE_TAG }}
          releaseBody: |
            ${{ inputs.notas }}

            ### Instalação

            Instaladores para Windows (`.exe` e `.msi`), Linux (`.deb`, `.rpm` e `.AppImage`)
            e macOS (`.dmg` para Apple Silicon e Intel). Veja o README para os requisitos.
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' && !inputs.tag_release }}
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_CONFIG }}

      - name: Verificar assinatura (Windows)
        if: runner.os == 'Windows' && (env.WINDOWS_CERTIFICATE_SECRET != '' || env.AZURE_CLIENT_ID_SECRET != '')
        shell: pwsh
        run: |
          $arquivos = Get-ChildItem -Recurse target/release/bundle -Include *.exe,*.msi
          foreach ($a in $arquivos) {
            $s = Get-AuthenticodeSignature $a.FullName
            Write-Host "$($a.Name): $($s.Status)"
            if ($s.Status -ne 'Valid') { throw "$($a.Name) não está assinado corretamente" }
          }
