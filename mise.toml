# Ferramentas usadas pelo port. Instale com `mise install` e rode tudo com
# `mise exec -- <comando>` (ou ative o ambiente com `mise en`).
[tools]
rust = "1.99.1"
node = "22.23.5"
# O Portugol Studio original compila com sourceCompatibility 1.8
# (projects.gradle). Usamos o JDK 8 para os testes diferenciais.
java = "temurin-8.0.512+9"

[tasks.test]
description = "Testa todos os crates do workspace"
run = "cargo test --workspace"

[tasks.lint]
description = "Clippy em todos os destinos"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
description = "Valida íntegra: Rust + frontend"
run = ["cargo test --workspace", "cd apps/desktop && npm run build"]

[tasks.corpus]
description = "Compara a VM com as saídas gravadas do corpus"
run = "cargo test -p portugol-vm --test regressao"
