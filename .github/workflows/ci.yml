name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  nucleo:
    name: Núcleo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'ubuntu-latest' && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Formatação
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Núcleo PORS mínimo (wasm32)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p portugol-vm --no-default-features --all-targets
          cargo clippy -p portugol-vm --no-default-features --all-targets -- -D warnings
          cargo check --target wasm32-unknown-unknown -p portugol-hir -p portugol-rs-frontend -p portugol-bytecode -p portugol-vm --no-default-features
          cargo build --target wasm32-unknown-unknown -p portugol-wasm
      - name: Testes (inclui regressão do corpus)
        run: cargo test

  ide:
    name: IDE (frontend + Tauri)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool xclip imagemagick x11-utils dbus-x11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Clippy do app
        run: cargo clippy -p portugol-desktop -- -D warnings
      - name: Compilar o app com protocolo de produção
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build -p portugol-desktop --features tauri/custom-protocol --config 'profile.dev.package."*".opt-level=0'
      - name: Testes do app
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p portugol-desktop --lib --features tauri/custom-protocol --config 'profile.dev.package."*".opt-level=0'
      - name: Janela gráfica nativa
        timeout-minutes: 2
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node apps/desktop/tests/graphics-smoke.mjs


  ide_multiplataforma:
    name: IDE (Tauri em ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Clippy do app
        run: cargo clippy -p portugol-desktop --all-targets -- -D warnings
      - name: Testes do app com protocolo de produção
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p portugol-desktop --lib --features tauri/custom-protocol
