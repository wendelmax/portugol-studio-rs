[workspace]
resolver = "2"
members = [
    "crates/portugol-syntax",
    "crates/portugol-semantics",
    "crates/portugol-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/wendelmax/Portugol-Studio"

[profile.release]
lto = "thin"
codegen-units = 1
