name: Preparar release

# Lança uma nova versão a partir da main:
#   1. calcula o número da versão pelos commits desde a última tag;
#   2. atualiza os manifestos e o CHANGELOG.md, faz o commit e cria a tag;
#   3. gera os instaladores e deixa o release em rascunho para revisão.
# Publicar o rascunho em Releases é o que faz a IDE oferecer a atualização.
# Detalhes em docs/DISTRIBUICAO.md.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão: automatica (pelos commits), patch, minor, major ou um número X.Y.Z"
        required: true
        default: automatica
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preparar:
    name: Versão e changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      notas: ${{ steps.notas.outputs.notas }}
    steps:
      - name: Somente a partir da main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Dispare este workflow na branch main."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calcular versão e atualizar arquivos
        id: versao
        env:
          VERSAO: ${{ inputs.versao }}
        run: scripts/release.sh "$VERSAO"

      - name: Ler notas
        id: notas
        run: |
          {
            echo "notas<<FIM_DAS_NOTAS"
            cat target/release-notes.md
            echo "FIM_DAS_NOTAS"
          } >> "$GITHUB_OUTPUT"

      - name: Commit e tag
        env:
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main "$TAG"

  instaladores:
    name: Instaladores
    needs: preparar
    uses: ./.github/workflows/release.yml
    with:
      tag_release: ${{ needs.preparar.outputs.tag }}
      notas: ${{ needs.preparar.outputs.notas }}
    secrets: inherit
