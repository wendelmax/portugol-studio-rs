[package]
name = "portugol-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI do Portugol: criação, validação, formatação, exportação Rust e execução de programas .pors e .por"

[[bin]]
name = "portugol"
path = "src/main.rs"

[dependencies]
portugol-syntax = { path = "../portugol-syntax" }
portugol-semantics = { path = "../portugol-semantics" }
portugol-rs-frontend = { path = "../portugol-rs-frontend" }
portugol-rust = { path = "../portugol-rust" }
portugol-bytecode = { path = "../portugol-bytecode" }
portugol-vm = { path = "../portugol-vm" }
