[package]
name = "portugol-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fachada do núcleo do Portugol para a IDE: análise e execução em segundo plano"

[dependencies]
portugol-syntax = { path = "../portugol-syntax" }
portugol-semantics = { path = "../portugol-semantics" }
portugol-bytecode = { path = "../portugol-bytecode" }
portugol-vm = { path = "../portugol-vm" }
serde = { version = "1", features = ["derive"] }
