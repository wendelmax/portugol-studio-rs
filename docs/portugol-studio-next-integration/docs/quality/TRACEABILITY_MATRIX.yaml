schemaVersion: '1.0'
status: proposed
# Exemplo, expandir para UI-001..UI-035 após auditoria do repo.
features:
  - id: FEAT-EXEC-001
    title: Executar arquivo ativo
    ui: [UI-003, UI-021, UI-033]
    useCases: [UC-06]
    backend: [ExecutionPort]
    tauriIpc: [run_start, run_cancel] # nomes provisórios
    scenarios: [FT-03]
    acceptance:
      - "Executa a revisão capturada, não uma revisão posterior"
      - "O console apresenta somente eventos da execução ativa"
      - "Cancelamento é confirmado pelo backend"
    implementationStatus: not_assessed
    testStatus: not_run
  - id: FEAT-TRANSLATION-001
    title: Tradução Portugol para Rust
    ui: [UI-015, UI-016]
    useCases: [UC-08]
    backend: [TranslationPort]
    tauriIpc: [source_translate]
    scenarios: [FT-06]
    acceptance:
      - "Resultado vinculado à revisão e com status de compatibilidade"
      - "Código desvinculado nunca é sobrescrito"
    implementationStatus: not_assessed
    testStatus: not_run
  - id: FEAT-LEARN-001
    title: Seletor dos níveis de aprendizagem
    ui: [UI-028, UI-015]
    useCases: [UC-05, UC-07]
    backend: [LearningModePreference, portugol-service::export_rust]
    tauriIpc: [export_rust]
    scenarios: [FT-02]
    acceptance:
      - "beginner preserva o editor e runtime Portugol atuais"
      - "bridge exibe somente a exportação real suportada pelo serviço atual"
      - "rust fica desabilitado somente quando a toolchain rustc não está disponível, com motivo explicado"
      - "trocar modo não altera o texto fonte nem inicia outra engine"
    implementationStatus: implemented
    testStatus: automated_partial
    limitations:
      - "Preferência global em localStorage até existir WorkspaceStore"
      - "FT-02 não possui runner Gherkin; transição visual requer smoke/E2E posterior"
  - id: FEAT-LEARN-002
    title: Cartões de conceitos para Beginner e Bridge
    ui: [UI-023, UI-024]
    useCases: [UC-13]
    backend: [learning-content::conceptsForMode, learning-content::resolveConceptForMode]
    tauriIpc: []
    scenarios: [FT-05]
    acceptance:
      - "conceitos são selecionados explicitamente; nenhuma detecção informal por texto/posição"
      - "Beginner oferece fundamentos Portugol e Bridge inclui comparações Rust editoriais"
      - "ownership explica movimento e distingue o exemplo editorial da tradução atual"
      - "abrir ou estudar um cartão não registra progresso"
    implementationStatus: implemented
    testStatus: automated_partial
    limitations:
      - "Conteúdo é estático/local; ainda não há currículo versionado ou autoria de professor"
      - "FT-05 não possui runner Gherkin nem teste DOM/E2E configurado"
  - id: FEAT-LEARN-003
    title: Modo Rust integrado ao editor e executor existentes
    ui: [UI-028, UI-023, UI-024, UI-027]
    useCases: [UC-05, UC-13, UC-15]
    backend: [LearningModePreference, rust_toolchain_available, run_rust_source]
    tauriIpc: [rust_toolchain_available, register_rust_source_run, run_rust_source]
    scenarios: [FT-02, FT-05, FT-07]
    acceptance:
      - "Rust só pode ser selecionado quando a toolchain instalada é detectada"
      - "selecionar modo não altera o documento ou troca implicitamente sua linguagem"
      - "arquivo .rs usa o editor CodeMirror e o executor Rust existentes"
      - "exemplos ownership e borrowing têm seleção manual e proveniência editorial"
      - "laboratório memory mantém rótulo de simulação didática, sem alegar runtime trace"
      - "execução Rust preserva consentimento sem sandbox e limites do executor"
    implementationStatus: implemented
    testStatus: automated_partial
    tests:
      - "apps/desktop/tests/learning-mode.test.mjs"
      - "apps/desktop/tests/learning-content.test.mjs"
      - "apps/desktop/tests/ownership-lab.test.mjs"
    limitations:
      - "FT-02/05/07 ainda não têm runner Gherkin ou E2E visual dedicado"
      - "formatador e depuração Rust não estão disponíveis"
  - id: FEAT-PORS-INPUT-001
    title: Entrada interativa leia no Portugol-RS
    ui: [UI-003, UI-021]
    useCases: [UC-06]
    backend: [portugol-rs-frontend::Parser, portugol-hir::StmtKind::Read, portugol-rust::codegen, portugol-service::run_portugol_rs_with_io]
    tauriIpc: [register_portugol_rs_run, run_portugol_rs, send_input, stop]
    scenarios: [FT-03]
    acceptance:
      - "leia aceita somente bindings mutáveis declarados e tipados"
      - "o console solicita e encaminha a entrada para o processo ativo"
      - "o programa retoma após receber cada linha e mostra a saída anterior ao pedido"
      - "espera por entrada é cancelável e não consome o limite de execução ativa"
      - "entrada textual respeita o orçamento de memória de strings do Portugol-RS"
    implementationStatus: implemented
    testStatus: automated_partial
    tests:
      - "crates/portugol-rs-frontend/tests/parser.rs"
      - "crates/portugol-service/tests/portugol_rs_runner.rs"
      - "apps/desktop/tests/pors-input.test.mjs"
      - "apps/desktop/tests/pors-editor-loops.test.mjs"
    limitations:
      - "Somente uma variável por chamada leia"
      - "Depuração Portugol-RS ainda não está disponível"
  - id: FEAT-RUST-ARGS-001
    title: Argumentos argv para programas Rust standalone
    ui: [UI-028, UI-003, UI-021]
    useCases: [UC-06]
    backend: [process-arguments::parseProcessArguments, portugol-service::run_rust_source_with_args_and_cancel]
    tauriIpc: [run_rust_source]
    scenarios: [FT-03]
    acceptance:
      - "argumentos com espaço, Unicode, aspas literais e valor vazio chegam intactos a std::env::args()"
      - "a execução não usa shell e o executável permanece o binário temporário compilado pela IDE"
      - "aspas não fechadas são recusadas antes do prompt de consentimento ou execução"
      - "mais de 256 argumentos, total acima de 64 KiB e NUL são rejeitados pelo serviço"
      - "array vazio preserva a execução Rust anterior"
      - "campo e atalho de parâmetros ficam disponíveis em arquivos .rs e continuam indisponíveis em .pors"
    implementationStatus: implemented
    testStatus: automated_partial
    tests:
      - "apps/desktop/tests/process-arguments.test.mjs"
      - "apps/desktop/tests/learning-mode.test.mjs"
      - "apps/desktop/tests/source-map.test.mjs"
      - "crates/portugol-service/tests/rust_source_runner.rs"
    limitations:
      - "Sem runner E2E de interação DOM/Tauri para o campo"
      - "Parser documenta aspas duplas, não executa expansão de shell nem interpreta aspas simples como agrupamento"
